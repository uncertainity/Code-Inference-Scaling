protocol: solve_at_1
batch_size: 1000
concurrency: 64

task_paths:
  - fair_data/data_jsonl/apps_test.jsonl
  - fair_data/data_jsonl/lcb_test.jsonl

sampling_configs:
  thinking_24k_presence_1_0:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.0
    max_tokens: 24000
    chat_template_kwargs:
      enable_thinking: true

  thinking_12k_presence_1_0:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.0
    max_tokens: 12000
    chat_template_kwargs:
      enable_thinking: true

  thinking_8k_presence_1_0:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.0
    max_tokens: 8192
    chat_template_kwargs:
      enable_thinking: true

  thinking_4k_presence_1_0:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.0
    max_tokens: 4096
    chat_template_kwargs:
      enable_thinking: true

  no_thinking_sampled_4k:
    temperature: 0.2
    top_p: 0.95
    repetition_penalty: 1.05
    max_tokens: 4096
    chat_template_kwargs:
      enable_thinking: false
